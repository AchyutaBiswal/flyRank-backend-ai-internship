server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:flyrank_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

  cache:
    type: simple

app:
  jwt:
    secret: test-secret-key-used-only-for-automated-tests-not-for-production-use
    expiration-ms: 3600000
  llm:
    api-url: https://api.openai.com/v1/chat/completions
    api-key: ""
    model: gpt-4o-mini
    enabled: false
  reports:
    output-dir: ./build-test-reports
    scheduler-cron: 0 0 1 * * *

logging:
  level:
    root: WARN
